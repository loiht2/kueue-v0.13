apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kueue-controller-checkpointbackup
rules:
  - apiGroups:
      - migration.dcnlab.com
    resources:
      - checkpointbackups
    verbs:
      - get
      - list
      - watch
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kueue-controller-checkpointbackup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kueue-controller-checkpointbackup
subjects:
  - kind: ServiceAccount
    name: kueue-controller-manager
    namespace: kueue-system
